<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discord</title>
<style>
:root{
  --blurple:#5865f2; --blurple-hover:#4752c4; --green:#23a55a; --yellow:#f0b232;
  --red:#ed4245; --stream:#593695; --gray:#80848e;
  --bg-tertiary:#1e1f22; --bg-secondary:#2b2d31; --bg-primary:#313338; --bg-floating:#111214;
  --header:#f2f3f5; --text:#dbdee1; --muted:#949ba4; --link:#00a8fc;
  --chan-default:#80848e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"gg sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-tertiary); color:var(--text); font-size:16px; overflow:hidden;
  display:flex; flex-direction:column;
}
button{font-family:inherit}

/* ---------- app shell ---------- */
#app{display:flex;flex:1;min-height:0}

/* ---------- server rail ---------- */
.rail{width:72px;background:var(--bg-tertiary);display:flex;flex-direction:column;
  align-items:center;padding:12px 0;gap:8px;flex-shrink:0;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.rail-btn{position:relative;width:48px;height:48px;border:0;background:transparent;cursor:pointer;padding:0}
.rail-btn .icon{display:flex;width:48px;height:48px;border-radius:50%;background:var(--bg-primary);
  color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  transition:border-radius .15s ease,background .15s ease;overflow:hidden}
.rail-btn .icon img{width:100%;height:100%;object-fit:cover}
.rail-btn:hover .icon,.rail-btn.active .icon{border-radius:16px}
.rail-btn.active .icon{background:var(--blurple)}
.rail-btn .bar{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:8px;
  border-radius:0 4px 4px 0;background:#fff;opacity:0;transition:all .15s ease}
.rail-btn.active .bar{height:40px;opacity:1}
.rail-btn.unread .bar{height:8px;opacity:1}
.rail-btn.ping .icon{background:var(--blurple)}
.rail-sep{width:32px;height:2px;background:rgba(78,80,88,.6);border-radius:1px;margin:2px 0;flex-shrink:0}
.rail-ping{position:absolute;right:-2px;bottom:-2px;background:var(--red);color:#fff;font-size:12px;
  font-weight:700;border-radius:10px;min-width:20px;height:20px;display:flex;align-items:center;
  justify-content:center;border:3px solid var(--bg-tertiary);padding:0 2px}

/* ---------- channel sidebar ---------- */
.sidebar{width:240px;background:var(--bg-secondary);display:flex;flex-direction:column;flex-shrink:0}
.server-head{background:none;border:0;border-bottom:1px solid var(--bg-tertiary);color:var(--header);
  font-weight:700;font-size:15px;text-align:left;padding:15px 16px;display:flex;
  justify-content:space-between;align-items:center;width:100%;cursor:pointer}
.server-head:hover{background:rgba(78,80,88,.2)}
.boost{font-size:11px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;
  padding:10px 16px 2px}
.chan-scroll{flex:1;overflow-y:auto;padding:0 8px 8px}
.cat{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em;padding:18px 8px 4px;
  display:flex;justify-content:space-between;align-items:center}
.chan{display:flex;align-items:center;gap:6px;color:var(--chan-default);font-size:15px;
  padding:6px 8px;border-radius:4px;text-decoration:none;cursor:pointer;margin:1px 0;font-weight:500}
.chan svg{flex-shrink:0}
.chan:hover{background:rgba(78,80,88,.3);color:var(--text)}
.chan.active{background:rgba(78,80,88,.6);color:#fff}
.chan .hash{color:var(--gray);font-weight:700}
.chan.active .hash{color:#fff}
.chan .mention-pill{margin-left:auto;background:var(--red);color:#fff;font-size:12px;font-weight:700;
  border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.vc-user{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 28px;font-size:14px;color:var(--chan-default)}
.vc-user:hover{background:rgba(78,80,88,.3);border-radius:4px;color:var(--text)}
.mini-av{width:20px;height:20px;border-radius:50%;flex-shrink:0}
.inav{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;
  font-weight:700;flex-shrink:0;overflow:hidden}
.av-wrap .inav{width:32px;height:32px}

/* user panel */
.user-panel{background:#232428;padding:8px;display:flex;align-items:center;gap:8px}
.av-wrap{position:relative;flex-shrink:0}
.av-wrap img{width:32px;height:32px;border-radius:50%;display:block}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:3px solid #232428}
.dot.online{background:var(--green)}.dot.idle{background:var(--yellow)}.dot.dnd{background:var(--red)}.dot.off{background:var(--gray)}
.me-name{color:var(--header);font-size:14px;font-weight:600;line-height:1.2}
.me-name small{color:var(--muted);font-weight:400;font-size:12px}
.panel-icons{margin-left:auto;display:flex;gap:2px}
.panel-icons button{background:none;border:0;color:#b5bac1;cursor:pointer;padding:4px;border-radius:4px}
.panel-icons button:hover{background:rgba(78,80,88,.5)}

/* ---------- chat column ---------- */
.chat{flex:1;background:var(--bg-primary);display:flex;flex-direction:column;min-width:0}
.chat-head{height:48px;border-bottom:1px solid var(--bg-tertiary);display:flex;align-items:center;
  gap:8px;padding:0 16px;color:var(--header);font-weight:700;font-size:16px;flex-shrink:0}
.chat-head .hash{color:var(--gray);font-size:20px}
.chat-head .topic{color:var(--muted);font-size:13px;font-weight:500;border-left:1px solid rgba(78,80,88,.6);
  padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-icons{margin-left:auto;display:flex;gap:14px;color:#b5bac1}
.head-icons span{cursor:pointer}.head-icons span:hover{color:#fff}

.msg-scroll{flex:1;overflow-y:auto;padding:16px 0 8px;display:flex;flex-direction:column}
.divider{display:flex;align-items:center;gap:8px;margin:14px 16px 6px;color:var(--muted);font-size:12px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(78,80,88,.4)}
.msg{display:flex;gap:16px;padding:6px 16px 6px 20px;position:relative}
.msg:hover{background:rgba(4,4,5,.07)}
.msg.pinged{background:rgba(88,101,242,.1)}
.msg.pinged::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--blurple)}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.msg-body{min-width:0;flex:1}
.msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.user{font-weight:600;font-size:16px;color:var(--header);cursor:pointer}
.user:hover{text-decoration:underline}
.role-admin{color:#f0b232}.role-mod{color:#eb459e}.role-dev{color:#57f287}.role-nitro{color:#00a8fc}
.role-badge{font-size:10px;font-weight:700;background:rgba(240,178,50,.2);color:#f0b232;border-radius:4px;
  padding:2px 5px;letter-spacing:.03em}
.time{color:var(--muted);font-size:12px}
.msg-text{color:var(--text);font-size:16px;line-height:1.375;margin-top:2px;word-wrap:break-word}
.mention{background:rgba(88,101,242,.3);color:#c7d2fe;border-radius:3px;padding:0 4px;cursor:pointer;font-weight:500}
.mention:hover{background:var(--blurple);color:#fff}
.msg-text a{color:var(--link);text-decoration:none}
.msg-text a:hover{text-decoration:underline}
.reactions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.react{background:rgba(78,80,88,.3);border:1px solid rgba(78,80,88,.6);color:var(--text);
  border-radius:8px;font-size:14px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:5px}
.react:hover{border-color:#b5bac1}
.react.mine{background:rgba(88,101,242,.3);border-color:var(--blurple);color:#c7d2fe}
.react .cnt{font-size:13px;font-weight:600}

/* embed */
.embed{background:var(--bg-secondary);border-left:4px solid var(--blurple);border-radius:4px;
  padding:12px 16px 12px 12px;max-width:516px;margin-top:8px}
.embed-author{color:#fff;font-size:14px;font-weight:600;margin-bottom:2px}
.embed-title{color:var(--link);font-size:16px;font-weight:600}
.embed-desc{color:var(--text);font-size:14px;margin-top:2px}
.embed-grid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.embed-thumb{width:80px;height:80px;border-radius:8px;object-fit:cover;background:var(--blurple)}

/* typing + composer */
.typing{padding:4px 20px;color:var(--muted);font-size:13px;min-height:24px}
.composer-wrap{padding:0 16px 24px;flex-shrink:0}
.composer{background:#383a40;border-radius:8px;display:flex;align-items:center;padding:0 8px 0 16px;gap:8px}
.composer input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;padding:12px 0}
.composer input::placeholder{color:#6d6f78}
.composer button{background:none;border:0;color:#b5bac1;cursor:pointer;padding:8px}
.composer button:hover{color:#fff}

/* ---------- member list ---------- */
.members{width:240px;background:var(--bg-secondary);flex-shrink:0;overflow-y:auto;padding:16px 8px 16px 16px}
.members .cat{padding-top:8px}
.member{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;cursor:pointer}
.member:hover{background:rgba(78,80,88,.3)}
.member .av-wrap img{width:32px;height:32px}
.member .name{font-size:15px;font-weight:500;color:var(--chan-default)}
.member .name.role-admin,.member .name.role-mod,.member .name.role-dev,.member .name.role-nitro{color:inherit}
.role-admin.name{color:#f0b232}.role-mod.name{color:#eb459e}.role-dev.name{color:#57f287}.role-nitro.name{color:#00a8fc}

/* ---------- footer ---------- */
footer{background:var(--bg-tertiary);color:var(--muted);font-size:12px;text-align:center;
  padding:10px;border-top:1px solid rgba(78,80,88,.3);flex-shrink:0}

/* toast */
.toast{position:fixed;bottom:64px;right:24px;background:var(--bg-floating);color:var(--text);
  border-radius:8px;padding:12px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:none;gap:12px;align-items:center;z-index:50}
.toast.show{display:flex;animation:pop .2s ease}
.toast button{background:var(--blurple);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:1100px){.members{display:none}}
@media (max-width:760px){.sidebar{display:none}.rail{width:60px}.chat-head .topic{display:none}}
</style>
</head>

<script>
/* Inline initial avatars (deterministic hue per name) — no external avatar service */
function AV(seed){
  const s = String(seed);
  let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const hue = [248,160,28,336,204,18,290,120][h % 8];
  const init = s.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(${hue},45%,38%)"/><text x="40" y="54" font-family="sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">${init}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

  ]},
};

const roleNames = {admin:"SERVER OWNER", mod:"MODERATOR", dev:"DEVELOPER", nitro:"NITRO BOOSTER", "":"MEMBERS"};

function renderMembers(){
  const el = document.getElementById("memberList");
  const order = ["admin","mod","dev","nitro",""];
  el.innerHTML = order.map(r=>{
    const list = members.filter(m=>m.role===r);
    if(!list.length) return "";
    return `<div class="cat">${roleNames[r]} — ${list.length}</div>` +
      list.map(m=>`<div class="member"><div class="av-wrap"><img src="${AV(m.name)}" alt=""><span class="dot ${m.status}"></span></div><span class="name role-${m.role}">${m.name}</span></div>`).join("");
  }).join("");
}

function msgHTML(m){
  const reacts = (m.reacts||[]).map(r=>`<button class="react" data-r="${r[0]}">${r[0]} <span class="cnt">${r[1]}</span></button>`).join("");
  const embed = m.embed ? `<div class="embed"><div class="embed-grid"><div><div class="embed-author">${m.embed.author}</div><div class="embed-title">${m.embed.title}</div><div class="embed-desc">${m.embed.desc}</div></div><img class="embed-thumb" src="${AV(m.embed.title)}" alt=""></div></div>` : "";
  const badge = m.r==="admin" ? `<span class="role-badge">OWNER</span>` : (m.bot ? `<span class="role-badge" style="background:rgba(88,101,242,.3);color:#c7d2fe">BOT</span>` : "");
  return `<div class="msg${m.pinged?" pinged":""}">
    <img class="avatar" src="${AV(m.u)}" alt="">
    <div class="msg-body">
      <div class="msg-head"><span class="user role-${m.r}">${m.u}</span>${badge}<span class="time">${m.t}</span></div>
      <div class="msg-text">${m.text}</div>${embed}
      ${reacts?`<div class="reactions">${reacts}</div>`:""}
    </div></div>`;
}

let current = "general";
function renderChannel(){
  const c = channels[current];
  document.getElementById("chanTitle").textContent = current;
  document.getElementById("chanTopic").textContent = c.topic;
  document.getElementById("composer").placeholder = "Message #" + current;
  const scroll = document.getElementById("msgScroll");
  scroll.innerHTML = `<div class="divider">Today</div>` + c.msgs.map(msgHTML).join("");
  scroll.scrollTop = scroll.scrollHeight;
  wireReacts();
}

document.getElementById("chanList").addEventListener("click", e=>{
  const a = e.target.closest(".chan[data-chan]");
  if(!a || !channels[a.dataset.chan]) return;
  document.querySelectorAll(".chan").forEach(x=>x.classList.remove("active"));
  a.classList.add("active");
  current = a.dataset.chan;
  renderChannel();
});

function wireReacts(){
  document.querySelectorAll(".react").forEach(btn=>{
    btn.onclick = ()=>{
      const cnt = btn.querySelector(".cnt");
      let n = parseInt(cnt.textContent,10);
      if(btn.classList.contains("mine")){ btn.classList.remove("mine"); cnt.textContent = n-1; }
      else { btn.classList.add("mine"); cnt.textContent = n+1; }
    };
  });
}

// send messages
document.getElementById("composer").addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  const inp = e.target, v = inp.value.trim();
  if(!v) return;
  const esc = v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  channels[current].msgs.push({u:"you",r:"nitro",t:"Today at now",text:esc});
  inp.value = "";
  renderChannel();
  if(/@(everyone|here|you)/i.test(v)) fakeReply();
});

// fake typing + reply
const replies = [
  {u:"Milo",r:"nitro",text:"okay that is actually a solid point, adding it to the list"},
  {u:"Nova",r:"mod",text:"noted. putting it in the pinned thread so nobody forgets"},
  {u:"Kira",r:"dev",text:"+1. this is exactly the kind of thing we argued about for two hours last week"},
  {u:"Jax",r:"",text:"say less. i am already in voice"},
];
function fakeReply(){
  const t = document.getElementById("typing");
  const r = replies[Math.floor(Math.random()*replies.length)];
  t.textContent = r.u + " is typing...";
  setTimeout(()=>{
    t.textContent = "";
    channels[current].msgs.push({u:r.u,r:r.r,t:"Today at now",text:r.text});
    renderChannel();
  }, 1600);
}

// stream toast
setTimeout(()=>{
  document.getElementById("toastText").innerHTML = "<b>Milo</b> started streaming <b>Ranked Grind</b>";
  document.getElementById("toast").classList.add("show");
  setTimeout(()=>document.getElementById("toast").classList.remove("show"), 6000);
}, 5000);
document.getElementById("toastBtn").onclick = ()=>{
  document.getElementById("toast").classList.remove("show");
  channels.general.msgs.push({u:"Milo",r:"nitro",t:"Today at now",text:"stream is LIVE — ranked grind, come watch me not throw this time",embed:{author:"Milo",title:"Ranked Grind — LIVE",desc:"12 viewers · come hang out"},reacts:[["🔥",6]]});
  if(current==="general") renderChannel();
};

renderMembers();
renderChannel();
</script>
